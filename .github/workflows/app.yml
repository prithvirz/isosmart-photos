name: App

on:
  push:
    branches: [main, main-v3.3.6]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.9'
  RELEASE_CERT_SHA256: bf1e1ddab512246b20e353462c27302e30b3e8c5155d9f28c92420652cc2c629

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.build.outputs.version }}
      build: ${{ steps.build.outputs.build }}
      base_version: ${{ steps.server_gate.outputs.base_version }}
      server_match: ${{ steps.server_gate.outputs.server_match }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Mise & Tools
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies and Codegen
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      - name: Check server version
        id: server_gate
        if: startsWith(github.ref, 'refs/heads/sync/')
        run: |
          base=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' mobile/pubspec.yaml)
          server=$(curl -fsS --max-time 20 https://photos.isosmart.online/api/server/version | jq -r '"\(.major).\(.minor).\(.patch)"')
          echo "base_version=$base" >> "$GITHUB_OUTPUT"
          echo "app-base=$base server=$server"
          if [ "$base" = "$server" ]; then echo "server_match=true" >> "$GITHUB_OUTPUT"; else echo "server_match=false" >> "$GITHUB_OUTPUT"; fi

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.PHOTOS_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > mobile/android/key.jks
          echo "KEYSTORE_DECODED=true" >> $GITHUB_ENV

      - name: Build Android APK
        id: build
        working-directory: mobile
        env:
          PHOTOS_STORE_PASSWORD: ${{ secrets.PHOTOS_STORE_PASSWORD }}
          PHOTOS_KEY_PASSWORD: ${{ secrets.PHOTOS_KEY_PASSWORD }}
          PHOTOS_KEY_ALIAS: ${{ secrets.PHOTOS_KEY_ALIAS }}
        run: |
          version=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/sync/* && "${{ steps.server_gate.outputs.server_match }}" == "true" ]]; then
            version="${version}-iso.${GITHUB_RUN_NUMBER}"
          else
            version="${version}-iso.${GITHUB_RUN_NUMBER}"
          fi
          build=${{ github.run_number }}

          flutter build apk --release --target-platform android-arm,android-arm64 --build-name="$version" --build-number="$build"
          cp build/app/outputs/flutter-apk/app-release.apk "isosmart-photos-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Verify Signature
        if: github.event_name != 'pull_request'
        working-directory: mobile
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs isosmart-photos-*.apk | tee certs.txt
          grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256" certs.txt || { echo "::error::not signed with release key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/isosmart-photos-*.apk
          retention-days: 14

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (startsWith(github.ref, 'refs/heads/sync/') && needs.build.outputs.server_match == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: release-apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_number)
            tag="v${{ needs.build.outputs.base_version }}-iso.${run}"
          fi
          gh release create "$tag" release-apk/isosmart-photos-*.apk --target "$GITHUB_SHA" --title "Isosmart Photos ${tag#v}" --generate-notes

  notify:
    needs: [build, release]
    if: always() && (startsWith(github.ref, 'refs/heads/sync/') || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - env:
          TG_TOKEN: ${{ secrets.TG_ALERT_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_ALERT_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          text="Isosmart Photos ${GITHUB_REF_NAME}: build ${BUILD_RESULT}, release ${RELEASE_RESULT}"
          curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}" >/dev/null || true
